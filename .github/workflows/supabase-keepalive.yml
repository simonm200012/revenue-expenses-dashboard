name: Supabase keep-alive

# Supabase pauses free-tier projects after ~7 days without API activity,
# which took the whole dashboard offline on 2026-09-03. This job makes one
# tiny authenticated request per day so the project always counts as active.
# It uses the public anon key that already ships in index.html (no secret
# needed) and only reads a row count — no data is transferred or changed.

on:
  schedule:
    - cron: '17 5 * * *'   # daily 05:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase REST
        run: |
          set -euo pipefail
          URL=$(grep -o "https://[a-z]*\.supabase\.co" index.html | head -1)
          KEY=$(grep -o "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]*\.[A-Za-z0-9_-]*" index.html | head -1)
          test -n "$URL" && test -n "$KEY"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -I \
            "$URL/rest/v1/transactions?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Prefer: count=exact")
          echo "Supabase responded HTTP $CODE"
          case "$CODE" in 2*) ;; *) echo "::error::Supabase keep-alive failed with HTTP $CODE (project paused?)"; exit 1;; esac
