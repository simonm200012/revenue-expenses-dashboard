name: Fetch Trading 212 portfolio

on:
  # Every 30 minutes, weekdays, roughly 07:00–18:00 UTC
  # (covers 08:00–19:00 Ljubljana in CET and 09:00–20:00 Ljubljana in CEST).
  schedule:
    - cron: '*/30 7-18 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch from Trading 212
        env:
          T212_API_KEY: ${{ secrets.T212_API_KEY }}
          FINANCE_WORKER_TOKEN: ${{ secrets.FINANCE_WORKER_TOKEN }}
          T212_API_SECRET: ${{ secrets.T212_API_SECRET }}
        run: node scripts/scrape-t212.mjs
